name: Setup Build Base Composite Action
description: Base build actions for Meshtastic Platform IO steps

runs:
  using: composite
  steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install dependencies
      shell: bash
      run: |
        sudo apt-get -y update --fix-missing
        sudo apt-get install -y cppcheck libbluetooth-dev libsdbus-c++-dev libgpiod-dev libyaml-cpp-dev libjsoncpp-dev lsb-release

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.x
        cache: pip
        cache-dependency-path: |
          .github/actions/**
          **.ini

    - name: Upgrade python tools
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r .github/actions/setup-base/requirements.txt

    - name: Install SCons FortranCommon fallback shim
      # platformio==6.2.0 resolves tool-scons >= 4.9, which dropped
      # SCons.Tool.FortranCommon / SCons.Scanner.Fortran; the ESP32 hybrid
      # (espidf) builds still import them and fail with ModuleNotFoundError.
      shell: bash
      run: |
        SP=$(python -c "import site; print(site.getsitepackages()[0])")
        cp .github/actions/setup-base/scons-shim/*.py "$SP/"
        echo "import scons_fortran_hook" > "$SP/scons_fortran_hook.pth"
